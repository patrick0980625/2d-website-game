<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2d Website RPG Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      
      image-rendering: pixelated;
      margin: 0 !important;
    }
    
    @font-face {
      font-family: 'CuteFantasy';
      src: url('/assets/sprites/images/CuteFantasy-5x9.ttf');
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
